name: Build Windows V1.4.1 Safe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Prepare offline runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force runtime | Out-Null
          New-Item -ItemType Directory -Force runtime\whisper | Out-Null

          Write-Host "Downloading whisper.cpp Windows x64..."
          curl.exe -L --fail --retry 5 --retry-delay 2 -o whisper.zip "https://github.com/ggml-org/whisper.cpp/releases/download/b5130/whisper-bin-x64.zip"
          Expand-Archive -Path "whisper.zip" -DestinationPath "runtime\whisper" -Force

          Write-Host "Downloading multilingual base Q5_1 model..."
          Invoke-WebRequest -Uri "https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-base-q5_1.bin" -OutFile "runtime\ggml-base-q5_1.bin"
          if ((Get-Item "runtime\ggml-base-q5_1.bin").Length -lt 50000000) { throw "Whisper model incomplete" }

          Write-Host "Downloading FFmpeg..."
          curl.exe -L --fail --retry 5 --retry-delay 2 -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-dist" -Force
          $ff = Get-ChildItem "ffmpeg-dist" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ff) { throw "ffmpeg.exe not found" }
          Copy-Item $ff.FullName "runtime\ffmpeg.exe" -Force

          $checks = Get-ChildItem runtime -Recurse -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.FullName.Substring((Resolve-Path runtime).Path.Length+1).Replace("\\","/"))" }\n          $checks | Set-Content -Encoding ascii "runtime\\SHA256SUMS.txt"\n          @("906 Subtitle Tool offline runtime","whisper.cpp: https://github.com/ggml-org/whisper.cpp","Whisper model: https://huggingface.co/ggerganov/whisper.cpp","FFmpeg Windows build: https://github.com/BtbN/FFmpeg-Builds","All runtime components are bundled and are not downloaded at application runtime.") | Set-Content -Encoding UTF8 "runtime\\THIRD_PARTY.txt"\n          Get-ChildItem runtime -Recurse | Select-Object FullName,Length

      - name: Build Windows GUI executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          go mod tidy
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o "subtitle_tool_v1.4.1.exe" .
          if (-not (Test-Path "subtitle_tool_v1.4.1.exe")) { throw "EXE not generated" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "subtitle_tool_v1.4.1.exe" "dist\\906_SubtitleTool_V1.4.1.exe" -Force
          Copy-Item "runtime" "dist\\runtime" -Recurse -Force
          Get-ChildItem dist -Recurse | Select-Object FullName,Length

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: subtitle_tool_v1.4.1_safe
          path: dist
          compression-level: 6
          retention-days: 7
