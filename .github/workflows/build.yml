name: Build Windows V1.4.1 Safe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Prepare offline runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Remove-Item runtime -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "runtime\whisper" | Out-Null

          Write-Host "1/3 whisper.cpp"
          curl.exe -L --fail --retry 5 --retry-delay 2 -o whisper.zip "https://github.com/ggml-org/whisper.cpp/releases/download/b5130/whisper-bin-x64.zip"
          Expand-Archive whisper.zip whisper-all -Force
          $rel = Get-ChildItem whisper-all -Recurse -Directory | Where-Object { Test-Path (Join-Path $_.FullName "whisper-cli.exe") } | Select-Object -First 1
          if (-not $rel) { throw "whisper-cli.exe not found" }
          Copy-Item (Join-Path $rel.FullName "whisper-cli.exe") "runtime\whisper\" -Force
          Copy-Item (Join-Path $rel.FullName "whisper.dll") "runtime\whisper\" -Force
          Copy-Item (Join-Path $rel.FullName "ggml.dll") "runtime\whisper\" -Force
          Copy-Item (Join-Path $rel.FullName "ggml-base.dll") "runtime\whisper\" -Force
          Get-ChildItem $rel.FullName -Filter "ggml-cpu-*.dll" | ForEach-Object {
            Copy-Item $_.FullName "runtime\whisper\" -Force
          }

          Write-Host "2/3 official Whisper model"
          curl.exe -L --fail --retry 5 --retry-delay 2 -o "runtime\ggml-base-q5_1.bin" "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base-q5_1.bin"
          $modelHash = (Get-FileHash "runtime\ggml-base-q5_1.bin" -Algorithm SHA256).Hash.ToLower()
          if ($modelHash -ne "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898") {
            throw "Whisper model SHA256 mismatch: $modelHash"
          }

          Write-Host "3/3 FFmpeg"
          curl.exe -L --fail --retry 5 --retry-delay 2 -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Expand-Archive ffmpeg.zip ffmpeg-all -Force
          $ff = Get-ChildItem ffmpeg-all -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ff) { throw "ffmpeg.exe not found" }
          Copy-Item $ff.FullName "runtime\ffmpeg.exe" -Force

          $root = (Resolve-Path runtime).Path
          $lines = @()
          Get-ChildItem runtime -Recurse -File | Sort-Object FullName | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $relPath = $_.FullName.Substring($root.Length + 1).Replace("\","/")
            $lines += ($hash + "  " + $relPath)
          }
          $lines | Set-Content -Encoding ascii "runtime\SHA256SUMS.txt"

          @(
            "906 Subtitle Tool - offline runtime",
            "whisper.cpp source: https://github.com/ggml-org/whisper.cpp",
            "Whisper model source: https://huggingface.co/ggerganov/whisper.cpp",
            "FFmpeg Windows build source: https://github.com/BtbN/FFmpeg-Builds",
            "Application runtime does not download components."
          ) | Set-Content -Encoding UTF8 "runtime\THIRD_PARTY.txt"

      - name: Build Windows GUI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          go mod tidy
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o "906_SubtitleTool_V1.4.1.exe" .
          if (-not (Test-Path "906_SubtitleTool_V1.4.1.exe")) { throw "EXE not generated" }

      - name: Package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "906_SubtitleTool_V1.4.1.exe" "dist\" -Force
          Copy-Item "runtime" "dist\runtime" -Recurse -Force
          @(
            "906 Subtitle Tool V1.4.1",
            "Run 906_SubtitleTool_V1.4.1.exe.",
            "Keep the runtime folder beside the EXE.",
            "The application does not download recognition components at runtime."
          ) | Set-Content -Encoding ascii "dist\README.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 906_SubtitleTool_V1.4.1_Safe
          path: dist
          compression-level: 6
          retention-days: 7
